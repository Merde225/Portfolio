function readAndCompressImage(file, maxDim,
quality){
maxDim = maxDim || 1400; quality = quality ||
0.82;
return new Promise((resolve, reject) => {
const reader = new FileReader();

const img = new Image();
img.onload = () => {
let w = img.width, h = img.height;
if (w > maxDim || h > maxDim){
if (w > h){ h = Math.round(h * (maxDim / w)); w =
maxDim; }
else { w = Math.round(w * (maxDim / h)); h =
maxDim; }
}
const canvas =
document.createElement('canvas');
canvas.width = w; canvas.height = h;
canvas.getContext('2d').drawImage(img, 0, 0, w,
h);
resolve(canvas.toDataURL('image/jpeg', quality));
};
img.onerror = () => reject(new Error('image-load-
failed'));
img.src = e.target.result;
};

reader.readAsDataURL(file);
});
}
// Compresse une image en boucle jusqu'à tenir
sous maxBytes, pour rester
// confortablement sous la limite de 1 Mo par
document Firestore.
async function compressToLimit(file, maxBytes,
startDim, startQuality){
maxBytes = maxBytes || 900000;
let dim = startDim || 1100;
let quality = startQuality || 0.78;
let dataUrl = await readAndCompressImage(file,
dim, quality);
let attempts = 0;
while (dataUrl.length > maxBytes && attempts <
5){
quality = Math.max(0.4, quality - 0.15);
dim = Math.max(450, Math.round(dim * 0.85));

dataUrl = await readAndCompressImage(file,
dim, quality);
attempts++;
}
return dataUrl;
}

function render(){
if (!authReady){

'<section><p class="muted">Chargement…</p></
section>';

}
const hash = location.hash || '#/compte';
const { isAdmin, visitorEmail } = currentAccess();
if (hash.indexOf('#/admin') === 0 && !isAdmin){
location.hash = '#/compte'; return; }
if (hash === '#/accueil' && !isAdmin && !
visitorEmail){ location.hash = '#/compte'; return; }

!isAdmin;

updateActiveNav(hash);
const view = document.getElementById('view');
if (hash === '#/accueil'){ view.innerHTML =

else if (hash === '#/biographie'){
view.innerHTML = renderBiographie(); }
else if (hash === '#/contact'){ view.innerHTML =
renderContact(); }
else if (hash === '#/compte'){ view.innerHTML =
renderCompte(); wireCompte(); }
else if (hash === '#/admin/accueil'){
view.innerHTML = renderAdminAccueil();
wireAdminAccueil(); }
else if (hash === '#/admin/biographie'){
view.innerHTML = renderAdminBiographie();
wireAdminBiographie(); }
else if (hash === '#/admin/contact'){
view.innerHTML = renderAdminContact();
wireAdminContact(); }
else if (hash === '#/admin/compte'){
view.innerHTML = renderAdminCompte();
wireAdminCompte(); }
else { location.hash = '#/compte'; return; }

window.scrollTo(0,0);
}

if ('serviceWorker' in navigator){
window.addEventListener('load', () => {
navigator.serviceWorker.register('./service-
worker.js').catch(() => {});
});
}
}
let deferredInstallPrompt = null;
function watchInstallPrompt(){

window.addEventListener('beforeinstallprompt',
(e) => {
e.preventDefault();
deferredInstallPrompt = e;
const btn = document.getElementById('install-
btn');
if (btn) btn.hidden = false;
});
const btn = document.getElementById('install-
btn');
if (btn) btn.addEventListener('click', async () => {
if (!deferredInstallPrompt) return;
deferredInstallPrompt.prompt();
await deferredInstallPrompt.userChoice;
deferredInstallPrompt = null;
btn.hidden = true;
});
}
/*

=======================================
=====================
INITIALISATION
=======================================
===================== */
registerSW();
watchInstallPrompt();
if (NOT_CONFIGURED){
document.getElementById('view').innerHTML =

requise&lt;/h1&gt; &lt;p&gt;Ce site doit être relié

code&gt;.&lt;/p&gt; &lt;/section>;

document.getElementById('nav-public').hidden =
true;
} else {
buildNav();

'<section><p class="muted">Chargement…</p></
section>';

render();
});
window.addEventListener('hashchange', render);
}
